server {
    listen 80;
    include /etc/nginx/tls-include.conf;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # TileServer GL — style JSON and TileJSON (need URL rewriting)
    # We do NOT forward the Host header here, so TileServer generates URLs
    # with its internal hostname (tileserver:8080). We then rewrite those
    # to the external proxy paths under /tiles/.
    # Rewrites TileServer internal URLs to absolute external URLs.
    # Uses $scheme://$http_host so they work over both HTTP and HTTPS.
    # MapLibre requires absolute URLs for sprites, tiles, and fonts.
    location /tiles/styles/ {
        proxy_pass http://tileserver:8080/styles/;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/'   '$scheme://$http_host/tiles/data/';
        sub_filter 'http://tileserver:8080/styles/' '$scheme://$http_host/tiles/styles/';
        sub_filter 'http://tileserver:8080/fonts/'  '$scheme://$http_host/tiles/fonts/';
    }

    location /tiles/data/southwest5.json {
        proxy_pass http://tileserver:8080/data/southwest5.json;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/' '$scheme://$http_host/tiles/data/';
    }

    location /tiles/data/imagery.json {
        proxy_pass http://tileserver:8080/data/imagery.json;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/' '$scheme://$http_host/tiles/data/';
    }

    location /tiles/data/imagery_naip.json {
        proxy_pass http://tileserver:8080/data/imagery_naip.json;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/' '$scheme://$http_host/tiles/data/';
    }

    location /tiles/data/imagery_sentinel.json {
        proxy_pass http://tileserver:8080/data/imagery_sentinel.json;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/' '$scheme://$http_host/tiles/data/';
    }

    location /tiles/data/elevation.json {
        proxy_pass http://tileserver:8080/data/elevation.json;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/' '$scheme://$http_host/tiles/data/';
    }

    location /tiles/data/publiclands.json {
        proxy_pass http://tileserver:8080/data/publiclands.json;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/' '$scheme://$http_host/tiles/data/';
    }

    # TileServer GL — all other requests (tile data, fonts, sprites)
    # sub_filter rewrites internal TileServer URLs in JSON responses so
    # tile URLs work over both HTTP and HTTPS without per-layer location blocks.
    location /tiles/ {
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/'   '$scheme://$http_host/tiles/data/';
        sub_filter 'http://tileserver:8080/styles/' '$scheme://$http_host/tiles/styles/';
        sub_filter 'http://tileserver:8080/fonts/'  '$scheme://$http_host/tiles/fonts/';
    }

    # Nominatim geocoding
    location /nominatim/ {
        proxy_pass http://nominatim:8080/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # Valhalla routing
    location /valhalla/ {
        proxy_pass http://valhalla:8002/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # Unified search (POI + Nominatim proxy)
    location /search/ {
        proxy_pass http://search:8000/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # Speech-to-text (Whisper)
    # Uses resolver + variable so NGINX starts even if STT is down.
    # Without this, a missing STT container prevents the entire frontend.
    location /stt/ {
        resolver 127.0.0.11 valid=30s;
        set $stt_upstream http://stt:8000;
        rewrite ^/stt/(.*) /$1 break;
        proxy_pass $stt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    # Read-only admin endpoints (public, no auth)
    location /admin/status {
        proxy_pass http://search:8000/admin/status;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    location /admin/pipeline/status {
        proxy_pass http://search:8000/admin/pipeline/status;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    location /admin/credentials/status {
        proxy_pass http://search:8000/admin/credentials/status;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # GPS WebSocket
    location /gps/ {
        proxy_pass http://gps:8000/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ATAK map source XML (auto-generated)
    location /atak/ {
        alias /usr/share/nginx/html/atak/;
    }

    # TLS cert download (only serves when HTTPS enabled and file exists)
    location = /tls/ca.crt {
        alias /etc/nginx/tls/ca.crt;
    }
}

# Config panel — localhost only (Docker binding restricts access)
server {
    listen 8094;
    server_name _;

    # Most restrictive: only Docker gateway (host-originated) and loopback
    allow 172.18.0.1/32;
    allow 127.0.0.0/8;
    allow ::1;
    deny all;

    # Config panel UI
    location /config/ {
        alias /usr/share/nginx/html/config/;
        index index.html;
    }

    # Full admin API (all endpoints including writes)
    location /admin/ {
        proxy_pass http://search:8000/admin/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Config-Source internal;
        proxy_http_version 1.1;
    }

    # Tile proxy for minimap — style JSON with URL rewriting
    location /tiles/styles/ {
        proxy_pass http://tileserver:8080/styles/;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/'   '$scheme://$http_host/tiles/data/';
        sub_filter 'http://tileserver:8080/styles/' '$scheme://$http_host/tiles/styles/';
        sub_filter 'http://tileserver:8080/fonts/'  '$scheme://$http_host/tiles/fonts/';
    }

    # Tile proxy for minimap — TileJSON endpoints with URL rewriting
    location /tiles/data/southwest5.json {
        proxy_pass http://tileserver:8080/data/southwest5.json;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/' '$scheme://$http_host/tiles/data/';
    }

    # Tile proxy for minimap — raw tile data, fonts, sprites
    location /tiles/ {
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # Vendor assets (MapLibre GL JS/CSS)
    location /vendor/ {
        alias /usr/share/nginx/html/vendor/;
    }
}
