server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # TileServer GL — style JSON and TileJSON (need URL rewriting)
    # We do NOT forward the Host header here, so TileServer generates URLs
    # with its internal hostname (tileserver:8080). We then rewrite those
    # to the external proxy paths under /tiles/.
    location /tiles/styles/ {
        proxy_pass http://tileserver:8080/styles/;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/'   'http://$http_host/tiles/data/';
        sub_filter 'http://tileserver:8080/styles/' 'http://$http_host/tiles/styles/';
        sub_filter 'http://tileserver:8080/fonts/'  'http://$http_host/tiles/fonts/';
    }

    location /tiles/data/southwest5.json {
        proxy_pass http://tileserver:8080/data/southwest5.json;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter 'http://tileserver:8080/data/' 'http://$http_host/tiles/data/';
    }

    # TileServer GL — all other requests (tile data, fonts, sprites)
    location /tiles/ {
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # Nominatim geocoding
    location /nominatim/ {
        proxy_pass http://nominatim:8080/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # Valhalla routing
    location /valhalla/ {
        proxy_pass http://valhalla:8002/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # Unified search (POI + Nominatim proxy)
    location /search/ {
        proxy_pass http://search:8000/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # GPS WebSocket
    location /gps/ {
        proxy_pass http://gps:8000/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ATAK map source XML (auto-generated)
    location /atak/ {
        alias /usr/share/nginx/html/atak/;
    }
}
