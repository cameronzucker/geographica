skip_patterns:
- ^H[0-9]+$
parts:
  R1:
    lcsc: C17520
    tier: basic
    note: "Actually: 10 \u03A9 1/4W axial through-hole. LCSC's Basic Parts catalog\
      \ is SMD-biased \u2014 the Basic 10 \u03A9 entries are almost all 0603/0805\
      \ SMD. For through-hole you'll likely find a matching part in Extended Parts;\
      \ update tier to 'extended' if so."
  C1:
    lcsc: C14663
    tier: basic
    note: 100 nF 50V X7R disc cap, 2.5mm lead spacing
  RV1:
    lcsc: C48641779
    tier: extended
    note: "Bourns 3296W-1-103 or equivalent; 10 k\u03A9 multi-turn trim pot, vertical\
      \ mount, ~$2.50 each"
  J1:
    lcsc: C124379
    tier: extended
    note: "2\xD720 female pin socket, 2.54mm pitch, stacking height ~8.5mm. Needs\
      \ to mate with the male header on top of the LC29H HAT."
  J2:
    lcsc: C124378
    tier: extended
    note: "1\xD720 male pin header, 2.54mm pitch, standard break-off strip. Ribbon\
      \ connects here to the GDM12864H LCD module."
  J3:
    lcsc: C158013
    tier: basic
    note: JST XH-style 2-pin male vertical header, 2.50mm pitch. Mates with the Noctua
      NF-A4x10 5V fan's 3-pin Molex via a bundled JST-XH-to-fan adapter cable.
  J4:
    lcsc: C158013
    tier: basic
    note: "Same as J3 \u2014 second fan connector."
