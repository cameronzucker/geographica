services:
  tileserver:
    image: maptiler/tileserver-gl:v5.5.0-arm64
    container_name: geographica-tileserver
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./tileserver:/data
      - ./data:/srv/data
    command: ["--config", "/data/config.json"]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    container_name: geographica-valhalla
    restart: unless-stopped
    ports:
      - "8094:8002"
    environment:
      server_threads: "${VALHALLA_THREADS:-4}"
      serve_tiles: "True"
      use_tiles_ignore_pbf: "False"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
      build_transit: "False"
      build_tar: "True"
      force_rebuild: "False"
      update_existing_config: "True"
      tileset_name: "valhalla_tiles"
    volumes:
      - ./data/valhalla:/custom_files
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8002/status 2>/dev/null || curl -sf http://localhost:8002/status > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  nominatim:
    image: mediagis/nominatim:5.2.0
    container_name: geographica-nominatim
    restart: unless-stopped
    shm_size: "4gb"
    ports:
      - "8092:8080"
    environment:
      PBF_PATH: /nominatim/data/region.osm.pbf
      UPDATE_MODE: none
      FREEZE: "true"
      IMPORT_STYLE: full
      THREADS: "4"
      WARMUP_ON_STARTUP: "true"
      POSTGRES_SHARED_BUFFERS: "${POSTGRES_SHARED_BUFFERS:-1GB}"
      POSTGRES_MAINTENANCE_WORK_MEM: "${POSTGRES_MAINTENANCE_WORK_MEM:-1GB}"
      POSTGRES_AUTOVACUUM_WORK_MEM: "${POSTGRES_AUTOVACUUM_WORK_MEM:-256MB}"
      POSTGRES_WORK_MEM: "${POSTGRES_WORK_MEM:-32MB}"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}"
    volumes:
      - ./data/nominatim:/nominatim/data
      - nominatim-db:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/status 2>/dev/null || curl -sf http://localhost:8080/status > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  gps:
    build:
      context: ./services/gps
    container_name: geographica-gps
    restart: unless-stopped
    ports:
      - "8095:8000"
    devices:
      - "/dev/ttyAMA0:/dev/ttyAMA0"
    privileged: true
    volumes:
      - /run/gpsd.sock:/run/gpsd.sock:ro
    environment:
      GPSD_HOST: "host.docker.internal"
      GPSD_PORT: "2947"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 3s
      retries: 3

  search:
    build:
      context: ./services/search
    container_name: geographica-search
    restart: unless-stopped
    ports:
      - "8096:8000"
    environment:
      NOMINATIM_URL: "http://nominatim:8080"
      POI_DB_PATH: "/data/poi.sqlite"
      DATA_HOST_PATH: "${DATA_HOST_PATH:-/srv/geographica/data}"
      SCRIPTS_HOST_PATH: "${SCRIPTS_HOST_PATH:-/home/administrator/Code/geographica/scripts}"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      nominatim:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 3s
      retries: 3

  stt:
    build:
      context: ./services/stt
    container_name: geographica-stt
    restart: unless-stopped
    ports:
      - "8098:8000"
    environment:
      STT_BACKEND: "${STT_BACKEND:-cpu}"
      MODEL_PATH: "/data/models"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: nginx:alpine
    container_name: geographica-frontend
    restart: unless-stopped
    depends_on:
      - tileserver
      - nominatim
      - valhalla
      - gps
      - search
      - stt
    ports:
      - "8093:80"
      - "${TLS_PORT:-443}:443"
      - "127.0.0.1:8097:8094"
    environment:
      TLS_MODE: "${TLS_MODE:-http}"
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls-include.conf:/etc/nginx/tls-modes/tls-include.conf:ro
      - ./nginx/tls-include-empty.conf:/etc/nginx/tls-modes/tls-include-empty.conf:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ${TLS_CERT_DIR:-./tls}:/etc/nginx/tls

  pipeline:
    build:
      context: ./services/pipeline
    container_name: geographica-pipeline
    profiles: ["pipeline"]
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data
    environment:
      GDAL_CACHEMAX: "1024"
      PYTHONUNBUFFERED: "1"
    deploy:
      resources:
        limits:
          memory: 2G
    # Entrypoint is set when started via docker compose run
    # Default: idle (exits immediately if no command given)
    entrypoint: ["python3"]

volumes:
  nominatim-db:
  nominatim-flatnode:
